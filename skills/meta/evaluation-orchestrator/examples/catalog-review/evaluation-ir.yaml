        distinguishing_conditions: [representative changes independently of narrative order]
      - alternative_id: CANDIDATE-PRESENTATION-POLICY
        name: PresentationPolicy
        structural_difference: Moves representative selection into an explicit presentation policy object.
        benefits: [supports campaign-specific selection, preserves domain ordering]
        costs: [more concepts and configuration]
        migration_or_adoption: Introduce default policy matching current derivation, then allow overrides.
