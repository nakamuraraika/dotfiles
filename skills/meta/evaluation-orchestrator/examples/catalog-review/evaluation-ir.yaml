        statement: The minimum-order Arc is always suitable as representative presentation metadata.
        source_refs: []
        owner: catalog editing policy
        enforcement_layer: workflow
        prevention: Editing workflow must reject order changes that violate representative suitability.
        detection: Audit cards and SEO projections after ordering changes.
        repair: Restore prior order or select explicit representative metadata.
        violation_consequence: Unintended display and identity changes.
    attack:
      hypotheses:
        - hypothesis_id: ATTACK-PREQUEL-INSERT
          statement: Inserting a newly published prequel at the beginning changes representative metadata unintentionally.
          mechanism: One field encodes both sequence and representative priority.
          epistemic_class: hypothesis
          confidence: high
      counterexamples:
        - case: Insert a prequel with lower order while retaining the existing campaign visual.
          status: synthetic
          source_refs: []
      failure_modes:
        - trigger: A prequel is inserted before the current first Arc.
          mechanism: Representative selection is recomputed from order.
          observable_symptom: Work card and SEO image change without an explicit presentation decision.
          consequence: Published presentation identity changes unexpectedly.
          detectability: medium
          reversibility: moderate
    defense:
      strongest_case:
        - statement: Define order as representative priority rather than narrative order.
          required_conditions: [All editors understand the definition, APIs enforce the first Arc constraints]
          supporting_evidence: [write-path invariant test]
      collapse_conditions: [Users require narrative ordering independent of representative presentation]
      residual_risk: The overloaded meaning remains difficult to communicate and migrate.
    verification:
      questions:
        - Does order mean narrative order, publication order, or representative priority?
        - Is changing representative metadata an explicit business operation?
      distinguishing_tests:
        - test_id: TEST-PREQUEL-INSERT
          procedure: Insert a prequel and observe whether presentation should remain stable.
          observation_supporting_current: Product policy requires the new first Arc to become representative.
          observation_supporting_change: Product policy requires presentation to stay unchanged.
      missing_evidence: [catalog edit history showing reorder and representative changes]
      escalation_owner: product owner
